services:
  frontend:
    image: ${DOCKER_IMAGE:-kassa-app-front:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kassa-app-front
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Kassa System}
    ports:
      - "${APP_PORT:-3001}:3001"
    restart: unless-stopped
